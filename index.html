  <body>
    <div id="root"></div>
    <div id="app-splash" role="status" aria-label="Carregando CredMais" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#101010;color:#faf7f0;font-family:system-ui,sans-serif;transition:opacity .35s ease;">
      <div aria-hidden="true" style="position:relative;width:176px;height:176px;overflow:hidden;margin-bottom:20px;mask-image:linear-gradient(transparent,#000 8%,#000 88%,transparent)"><img src="/mascots/credinho-v2/loading.webp" alt="" fetchpriority="high" width="1254" height="1254" style="width:100%;height:100%;object-fit:contain;border-radius:24px" /></div>
      <strong style="color:#f5bd59;letter-spacing:.2em;font-size:13px">CREDMAIS</strong>
      <p style="font-size:14px;margin:16px 20px;text-align:center">Preparando seu próximo passo.</p>
      <div aria-hidden="true" style="height:3px;width:150px;background:#f5bd5926;overflow:hidden;border-radius:4px"><div style="height:100%;width:45%;background:#f5bd59;animation:sj-progress 1.7s ease-in-out infinite"></div></div>
      <style>@keyframes sj-progress{from{transform:translateX(-100%)}to{transform:translateX(325%)}}@media(prefers-reduced-motion:reduce){#app-splash,#app-splash *{animation:none!important;transition:none!important}}</style>
    </div>
    <script>
      (function () {
        var splashRemoved = false;
        window.__SJ_HIDE_SPLASH__ = function () {
          if (splashRemoved) return;
          splashRemoved = true;
          try { sessionStorage.removeItem("__sj_boot_recovering"); } catch (e) {}
          var splash = document.getElementById("app-splash");
          if (!splash) return;
          splash.style.opacity = "0";
          setTimeout(function () { splash.remove(); }, 350);
        };

        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) window.__SJ_HIDE_SPLASH__();
          }, 1200);
        });

        window.__SJ_SHOW_BOOT_ERROR__ = function () {
          var root = document.getElementById("root");
          var splash = document.getElementById("app-splash");
          if (!splash || (root && root.childElementCount > 0)) return;
          splash.innerHTML = '<div style="font-size:1rem;font-weight:700;margin-bottom:.5rem;">A conexão está demorando</div><div style="font-size:.85rem;color:#aab6d3;margin:0 20px 1rem;text-align:center;max-width:300px;">Você pode aguardar o carregamento ou tentar novamente.</div><button type="button" style="border:0;border-radius:10px;background:#f5bd59;color:#101010;font-weight:700;padding:.75rem 1rem;min-height:44px;cursor:pointer;">Tentar novamente</button>';
          splash.querySelector("button").onclick = function () { location.reload(); };
        };
        setTimeout(window.__SJ_SHOW_BOOT_ERROR__, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
