server {
    listen 8080;
    server_name _;
    root /releases;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;
    location = /latest.json { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; add_header Access-Control-Allow-Origin "*" always; try_files $uri =404; }
    location = /CredMais.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="CredMais.apk"';
        try_files $uri =404;
    }
    location /versions/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition 'attachment; filename="CredMais.apk"';
        try_files $uri =404;
    }
    location / { try_files $uri =404; }
}
