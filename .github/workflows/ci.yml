name: CI

# Valida alterações antes da publicação, incluindo código financeiro e rotas.
on:
  pull_request:
  push:
    branches: [main, feat/mobile-nativo-capacitor]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de todas as dependências
        run: npm run audit

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint do frontend
        run: npm run lint

      - name: Regras de hooks do React (quebra de tela)
        run: node scripts/checar-hooks.mjs

      # As funções de servidor não entram no `tsc` do app. O type check delas
      # estava quebrado em 7 arquivos e ninguém via — no meio deles, o
      # `auto-late-fees` descartando o teto de juros do mapa de configuração.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tipos das funções de servidor
        run: node scripts/checar-funcoes.mjs

      - name: Testes das funções e do bot
        run: deno test supabase/functions/_shared/*_test.ts --allow-env --allow-net

      - name: Cotações no ambiente real das funções
        run: python3 scripts/testar-runtime-financeiro.py

      - name: Recibos, WhatsApp e assinaturas com provedores simulados
        run: npm run test:integrations

      - name: Testes
        run: npx vitest run

      - name: Catálogo da publicação e proteção do APK
        run: |
          npm run test:release
          python3 deploy/mobile/test_mobile_release.py

      - name: Build de produção
        run: npx vite build

  saas:
    name: Duas empresas em homologação isolada
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências fixadas para o bundle Deno
        run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Preparar a função para o runtime sem acesso externo
        run: |
          mkdir -p test-results/saas/runtime/main
          deno bundle --platform deno --output test-results/saas/runtime/main/index.js supabase/functions/upload-urls/index.ts > test-results/saas/bundle.log 2>&1
          cat test-results/saas/bundle.log
      - name: PostgreSQL, login Auth, permissões, caixa, portais e Storage reais
        run: |
          mkdir -p test-results/saas
          python3 scripts/testar-saas-staging.py > test-results/saas/matrix.log 2>&1
          cat test-results/saas/matrix.log
      - name: Guardar matriz ou diagnóstico de homologação
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-saas-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/saas/
          retention-days: 7
          if-no-files-found: error

  contratos:
    name: Sondagens opcionais na interface de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.E2E_SECURITY_BASE_URL != '' && vars.E2E_SECURITY_SUPABASE_URL != '' }}
    env:
      E2E_BASE_URL: ${{ vars.E2E_SECURITY_BASE_URL }}
      E2E_SUPABASE_URL: ${{ vars.E2E_SECURITY_SUPABASE_URL }}
      E2E_ANON_KEY: ${{ secrets.E2E_SECURITY_ANON_KEY }}
      E2E_ALLOW_SECURITY_PROBES: "1"

    # As sondagens incluem escrita com credencial inválida. Execute somente em
    # homologação: se uma proteção regredir, nenhuma conta real será afetada.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/dinheiro.spec.ts e2e/responsive-accessibility.spec.ts

  login:
    name: Login, rotas e interface (E2E local isolado)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The Azure HTTP mirror stalled repeatedly while fetching WebKit's codecs.
      - name: Usar o mirror oficial do Ubuntu por HTTPS
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps chromium webkit
      - name: Testar login e interface com dados simulados
        timeout-minutes: 12
        # WebKit exercises the iPhone fetch errors and recovery too.
        run: npm run test:e2e:local

      - name: Guardar diagnóstico das tentativas de interface
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: interface-simulada-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  segredos:
    name: Nenhum segredo no diff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Este repositório já vazou CRON_SECRET e APIs de provedores no passado.
      # Evolution dentro de arquivos de migration. Esta verificação existe para
      # que não aconteça de novo pelo mesmo caminho.
      - name: Procurar padrões de segredo nos arquivos versionados
        run: |
          set -uo pipefail
          PADROES='(ghp_[A-Za-z0-9]{20,}|sbp_[a-f0-9]{40,}|service_role.{0,40}eyJ|SUPABASE_SERVICE_ROLE_KEY\s*=\s*["'"'"']?eyJ|x-cron-secret"\s*:\s*"[a-f0-9]{32,})'
          # O próprio arquivo é excluído: ele contém os padrões escritos por
          # extenso e casaria consigo mesmo em toda execução.
          if grep -rInE "$PADROES" \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
               --exclude-dir=test-results --exclude-dir=playwright-report \
               --exclude=package-lock.json --exclude=bun.lock --exclude=ci.yml . ; then
            echo "::error::Possível segredo versionado. Mova o valor para os secrets do Supabase ou para o Vault."
            exit 1
          fi
          echo "Nenhum padrão de segredo encontrado."
