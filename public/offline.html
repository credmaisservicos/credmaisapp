<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E3A33E" />
    <title>CredMais App — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: radial-gradient(ellipse at top, #302619 0%, #101010 62%);
        color: #F5F7FF;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(20, 18, 15, 0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(245, 189, 89, 0.28);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
      .brand {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid rgba(245, 189, 89, 0.55);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245, 189, 89, 0.45); }
        50% { box-shadow: 0 0 0 18px rgba(245, 189, 89, 0); }
      }
      h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
      p { font-size: 0.9rem; color: #B9C9E8; line-height: 1.55; margin-bottom: 1.5rem; }
      button {
        background: linear-gradient(135deg, #F5BD59, #E3A33E);
        color: #201a10;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s, box-shadow 0.15s;
        box-shadow: 0 8px 24px rgba(245, 189, 89, 0.35);
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(245, 189, 89, 0.5); }
      button:focus-visible { outline: 3px solid #FFDC91; outline-offset: 3px; }
      .status {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #91A9D1;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #ef4444;
        animation: blink 1.5s infinite;
      }
      @keyframes blink { 50% { opacity: 0.3; } }
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
    <div class="card">
      <div aria-hidden="true" style="position:relative;width:150px;height:150px;overflow:hidden;margin:0 auto 18px;mask-image:linear-gradient(transparent,#000 10%,#000 86%,transparent)"><img src="/mascots/credinho-v2/thinking.webp" alt="" width="1254" height="1254" style="width:100%;height:100%;object-fit:contain;border-radius:24px" /></div>
      <h1>Você está offline</h1>
      <p>Sem conexão no momento. Verifique sua internet — os dados já carregados continuam disponíveis.</p>
      <button onclick="location.reload()">Tentar novamente</button>
      <div class="status"><span class="dot"></span><span id="net-status">Sem conexão</span></div>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
      const upd = () => document.getElementById("net-status").textContent =
        navigator.onLine ? "Conexão restaurada" : "Sem conexão";
      window.addEventListener("online", upd);
      window.addEventListener("offline", upd);
    </script>
  </body>
</html>
